<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--sub:#5d6670;--line:#e3e6ea;--acc:#2a78d6;--neg:#d0392b}

.err{color:var(--neg);font-size:13px;min-height:20px;margin-top:8px}
</style></head><body>
